<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"
     width="400" height="500" role="img"
     aria-label="Illustration of Matcha Uji Ceremonial">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="6" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6E8B2E" stroke-width="1.6"
            opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#E9E2D3"/>
  <!-- a single hairline frame, in place of a card border -->
  <rect x="20" y="20" width="360" height="460" fill="none"
        stroke="#D6CEBD" stroke-width="1.5"/>
  <g transform="translate(200 240)">
    <path d="M-16.0 0 C -25.0 -13.860000000000001 -7.0 -27.720000000000002 -16.0 -42" stroke="#6E8B2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M0.0 0 C -9.0 -18.48 9.0 -36.96 0.0 -56" stroke="#6E8B2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M16.0 0 C 7.0 -13.860000000000001 25.0 -27.720000000000002 16.0 -42" stroke="#6E8B2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- liquid -->
  <path d="M112 266 L288 266 C286 300 262 330 200 330
           C138 330 114 300 112 266 Z" fill="#6E8B2E"/>
  <ellipse cx="200" cy="266" rx="88" ry="15" fill="#6E8B2E"/>
  <ellipse cx="200" cy="264" rx="74" ry="11" fill="#F3EEE4" opacity="0.22"/>
  <!-- bowl wall -->
  <path d="M104 258 L296 258 C294 306 258 344 200 344
           C142 344 106 306 104 258 Z" fill="none"
        stroke="#1A1916" stroke-width="2.5"/>
  <line x1="104" y1="258" x2="296" y2="258" stroke="#1A1916" stroke-width="2.5"/>
  <!-- foot -->
  <rect x="172" y="344" width="56" height="14" fill="#1A1916"/>
  <!-- whisk marks in the foam -->
  <path d="M166 262 C182 256 218 256 234 262" stroke="#F3EEE4"
        stroke-width="2" fill="none" opacity="0.5"/>
  <g transform="translate(78 404) scale(-0.62 0.62)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#6E8B2E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#6E8B2E" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#6E8B2E" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#6E8B2E" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#6E8B2E" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- category rule and swatch, bottom left -->
  <line x1="40" y1="444" x2="150" y2="444" stroke="#1A1916"
        stroke-width="1.5"/>
  <circle cx="352" cy="444" r="9" fill="#6E8B2E"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:multiply"/>
</svg>
