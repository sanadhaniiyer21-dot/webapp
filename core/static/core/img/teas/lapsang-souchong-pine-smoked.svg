<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"
     width="400" height="500" role="img"
     aria-label="Illustration of Lapsang Souchong, Pine Smoked">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#55352A" stroke-width="1.6"
            opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#E9E2D3"/>
  <!-- a single hairline frame, in place of a card border -->
  <rect x="20" y="20" width="360" height="460" fill="none"
        stroke="#D6CEBD" stroke-width="1.5"/>
  <g transform="translate(318 150) scale(0.9 0.9)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#55352A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- lid -->
  <rect x="132" y="150" width="136" height="26" fill="#1A1916"/>
  <rect x="124" y="176" width="152" height="12" fill="#55352A"/>
  <!-- body -->
  <rect x="124" y="188" width="152" height="196" fill="#55352A"/>
  <rect x="124" y="188" width="152" height="196" fill="none"
        stroke="#1A1916" stroke-width="2"/>
  <!-- label band -->
  <rect x="124" y="252" width="152" height="68" fill="#F3EEE4"/>
  <line x1="124" y1="252" x2="276" y2="252" stroke="#1A1916" stroke-width="2"/>
  <line x1="124" y1="320" x2="276" y2="320" stroke="#1A1916" stroke-width="2"/>
  <line x1="140" y1="286" x2="260" y2="286" stroke="#55352A" stroke-width="2.5"/>
  <!-- hatched base, for weight -->
  <rect x="124" y="352" width="152" height="32" fill="url(#hatch)"/>
  <rect x="124" y="384" width="152" height="8" fill="#1A1916"/>
  <g transform="translate(78 404) scale(-0.62 0.62)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#55352A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#55352A" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- category rule and swatch, bottom left -->
  <line x1="40" y1="444" x2="150" y2="444" stroke="#1A1916"
        stroke-width="1.5"/>
  <circle cx="352" cy="444" r="9" fill="#55352A"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:multiply"/>
</svg>
