# Render blueprint for Maison Tisane.
#
# Django runs here as an ordinary long-lived web service, which is what it
# wants to be. Note PYTHON_VERSION: without it Render picks the newest Python
# it has, and a release that some wheels are not built for yet will fail the
# build with a compiler error that looks nothing like the real cause.
#
# Secrets are deliberately NOT in this file. sync: false means Render asks for
# the value in the dashboard and keeps it out of the repository.

services:
  - type: web
    name: maison-tisane
    runtime: python
    plan: free
    region: singapore

    buildCommand: "bash build.sh"
    startCommand: "gunicorn maison.wsgi --log-file - --workers 2 --timeout 60"

    # Render restarts the service if this stops returning a 2xx. /health/
    # returns 503 only when the database is unreachable, which is the one
    # condition where a restart might genuinely help.
    healthCheckPath: /health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      # Generated by Render, never stored here.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "0"
      - key: FORCE_HTTPS
        value: "1"
      - key: EXTERNAL_API_TIMEOUT
        value: "3"
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: MONGODB_DB
        value: "maison"
      - key: APP_VERSION
        value: "1.0.0"

      # Hostname only, no scheme. Replace with your real Render hostname.
      - key: ALLOWED_HOSTS
        sync: false
      # Full origin including https://. Without this every form post is a 403.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false

      # The INTERNAL connection string from the Postgres instance below.
      # SQLite cannot be used here: the free tier wipes the disk on deploy.
      - key: DATABASE_URL
        fromDatabase:
          name: maison-postgres
          property: connectionString

      # Entered in the dashboard. Leave either blank and the site still works:
      # no Mongo means chat logging is skipped, no Gemini key means the
      # assistant answers from saved text, which is SITE-1001.
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TICKET_API_TOKEN
        sync: false

databases:
  - name: maison-postgres
    plan: free
    region: singapore
