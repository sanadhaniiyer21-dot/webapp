<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800"
     width="600" height="800" role="img"
     aria-label="Line illustration of a cup of tea with two sprigs of tea leaves">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B5552F" stroke-width="1.6"
            opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="600" height="800" fill="#E9E2D3"/>
  <rect x="26" y="26" width="548" height="748" fill="none"
        stroke="#D6CEBD" stroke-width="1.5"/>

  <!-- horizon rule, which gives the objects somewhere to stand -->
  <line x1="26" y1="596" x2="574" y2="596" stroke="#1A1916"
        stroke-width="1.5"/>

  <g transform="translate(300 392)">
    <path d="M-24.0 0 C -33.0 -13.860000000000001 -15.0 -27.720000000000002 -24.0 -42" stroke="#2B3A2C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M-8.0 0 C -17.0 -18.48 1.0 -36.96 -8.0 -56" stroke="#2B3A2C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M8.0 0 C -1.0 -13.860000000000001 17.0 -27.720000000000002 8.0 -42" stroke="#2B3A2C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M24.0 0 C 15.0 -18.48 33.0 -36.96 24.0 -56" stroke="#2B3A2C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- saucer -->
  <ellipse cx="300" cy="582" rx="168" ry="26" fill="#F3EEE4"/>
  <ellipse cx="300" cy="582" rx="168" ry="26" fill="none" stroke="#1A1916"
           stroke-width="2.5"/>
  <ellipse cx="300" cy="578" rx="104" ry="16" fill="none" stroke="#D6CEBD"
           stroke-width="1.5"/>

  <!-- the tea itself -->
  <ellipse cx="300" cy="420" rx="118" ry="22" fill="#B5552F"/>
  <ellipse cx="300" cy="418" rx="96" ry="15" fill="#F3EEE4" opacity="0.18"/>

  <!-- cup wall -->
  <path d="M182 412 L418 412 C414 500 368 558 300 558
           C232 558 186 500 182 412 Z" fill="#F3EEE4" opacity="0.35"/>
  <path d="M182 412 L418 412 C414 500 368 558 300 558
           C232 558 186 500 182 412 Z" fill="none" stroke="#1A1916"
        stroke-width="3"/>
  <line x1="182" y1="412" x2="418" y2="412" stroke="#1A1916" stroke-width="3"/>
  <!-- handle -->
  <path d="M418 440 C470 440 476 506 420 512" fill="none" stroke="#1A1916"
        stroke-width="3" stroke-linecap="round"/>
  <!-- one band of colour on the cup, no shading -->
  <path d="M190 470 C214 478 386 478 410 470" fill="none" stroke="#B5552F"
        stroke-width="4" opacity="0.8"/>

  <g transform="translate(506 318) scale(1.6 1.6)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#2B3A2C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <g transform="translate(92 250) scale(-1.2 1.2)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#2B3A2C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#2B3A2C" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>

  <rect width="600" height="800" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:multiply"/>
</svg>
