<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"
     width="400" height="500" role="img"
     aria-label="Illustration of Lemongrass and Ginger">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="25" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#A8B44A" stroke-width="1.6"
            opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#E9E2D3"/>
  <!-- a single hairline frame, in place of a card border -->
  <rect x="20" y="20" width="360" height="460" fill="none"
        stroke="#D6CEBD" stroke-width="1.5"/>
  <g transform="translate(318 150) scale(0.9 0.9)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#A8B44A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- lid -->
  <rect x="150" y="162" width="100" height="22" fill="#1A1916"/>
  <rect x="158" y="184" width="84" height="10" fill="#D6CEBD"/>
  <!-- glass -->
  <path d="M140 194 L260 194 L260 374 L140 374 Z" fill="#E9E2D3"/>
  <!-- contents, loosely packed -->
  <g>
    <circle cx="172" cy="300" r="15" fill="#A8B44A" opacity="0.92"/>
    <circle cx="208" cy="286" r="18" fill="#A8B44A" opacity="0.8"/>
    <circle cx="236" cy="314" r="13" fill="#A8B44A" opacity="0.95"/>
    <circle cx="190" cy="330" r="16" fill="#A8B44A" opacity="0.72"/>
    <circle cx="224" cy="348" r="12" fill="#A8B44A" opacity="0.88"/>
    <circle cx="160" cy="344" r="11" fill="#A8B44A" opacity="0.8"/>
    <circle cx="206" cy="356" r="10" fill="#A8B44A" opacity="0.6"/>
  </g>
  <path d="M140 194 L260 194 L260 374 L140 374 Z" fill="none"
        stroke="#1A1916" stroke-width="2.5"/>
  <!-- one highlight line, flat, no gradient -->
  <line x1="154" y1="212" x2="154" y2="300" stroke="#F3EEE4"
        stroke-width="4" opacity="0.5"/>
  <!-- paper label -->
  <rect x="140" y="226" width="120" height="40" fill="#F3EEE4"/>
  <line x1="140" y1="226" x2="260" y2="226" stroke="#1A1916" stroke-width="1.8"/>
  <line x1="140" y1="266" x2="260" y2="266" stroke="#1A1916" stroke-width="1.8"/>
  <line x1="156" y1="246" x2="244" y2="246" stroke="#A8B44A" stroke-width="2.5"/>
  <g transform="translate(78 404) scale(-0.62 0.62)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#A8B44A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#A8B44A" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- category rule and swatch, bottom left -->
  <line x1="40" y1="444" x2="150" y2="444" stroke="#1A1916"
        stroke-width="1.5"/>
  <circle cx="352" cy="444" r="9" fill="#A8B44A"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:multiply"/>
</svg>
