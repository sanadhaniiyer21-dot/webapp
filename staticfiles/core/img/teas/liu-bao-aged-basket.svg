<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"
     width="400" height="500" role="img"
     aria-label="Illustration of Liu Bao Aged Basket">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="20" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4F3220" stroke-width="1.6"
            opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#E9E2D3"/>
  <!-- a single hairline frame, in place of a card border -->
  <rect x="20" y="20" width="360" height="460" fill="none"
        stroke="#D6CEBD" stroke-width="1.5"/>
  <g transform="translate(318 150) scale(0.9 0.9)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#4F3220" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- the paper the cake is wrapped in, laid open behind it -->
  <rect x="104" y="196" width="192" height="168" fill="#F3EEE4"/>
  <rect x="104" y="196" width="192" height="168" fill="none"
        stroke="#1A1916" stroke-width="2"/>
  <line x1="200" y1="196" x2="200" y2="364" stroke="#D6CEBD" stroke-width="1.5"/>
  <line x1="104" y1="280" x2="296" y2="280" stroke="#D6CEBD" stroke-width="1.5"/>
  <!-- cake, seen a little from above -->
  <path d="M110 262 L110 300 C110 322 150 338 200 338
           C250 338 290 322 290 300 L290 262 Z" fill="#4F3220"/>
  <ellipse cx="200" cy="262" rx="90" ry="36" fill="#4F3220"/>
  <path d="M110 262 L110 300 C110 322 150 338 200 338
           C250 338 290 322 290 300 L290 262" fill="none"
        stroke="#1A1916" stroke-width="2.5"/>
  <ellipse cx="200" cy="262" rx="90" ry="36" fill="none"
           stroke="#1A1916" stroke-width="2.5"/>
  <!-- the dimple every pressed cake has, where the cloth was knotted -->
  <ellipse cx="200" cy="260" rx="22" ry="9" fill="#1A1916" opacity="0.32"/>
  <ellipse cx="200" cy="262" rx="60" ry="23" fill="none" stroke="#F3EEE4"
           stroke-width="1.5" opacity="0.35"/>
  <g transform="translate(78 404) scale(-0.62 0.62)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#4F3220" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#4F3220" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- category rule and swatch, bottom left -->
  <line x1="40" y1="444" x2="150" y2="444" stroke="#1A1916"
        stroke-width="1.5"/>
  <circle cx="352" cy="444" r="9" fill="#4F3220"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:multiply"/>
</svg>
