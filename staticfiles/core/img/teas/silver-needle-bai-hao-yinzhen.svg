<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"
     width="400" height="500" role="img"
     aria-label="Illustration of Silver Needle Bai Hao Yinzhen">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C4B88A" stroke-width="1.6"
            opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#E9E2D3"/>
  <!-- a single hairline frame, in place of a card border -->
  <rect x="20" y="20" width="360" height="460" fill="none"
        stroke="#D6CEBD" stroke-width="1.5"/>
  <g transform="translate(318 150) scale(0.9 0.9)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#C4B88A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- folded top -->
  <path d="M136 168 L264 168 L256 196 L144 196 Z" fill="#1A1916"/>
  <rect x="186" y="156" width="28" height="16" fill="#C4B88A"/>
  <!-- body, slightly tapered -->
  <path d="M144 196 L256 196 L266 384 L134 384 Z" fill="#C4B88A"/>
  <path d="M144 196 L256 196 L266 384 L134 384 Z" fill="none"
        stroke="#1A1916" stroke-width="2"/>
  <!-- side gusset -->
  <path d="M232 196 L242 384" stroke="#1A1916" stroke-width="1.5" opacity="0.45"/>
  <!-- label -->
  <rect x="152" y="246" width="96" height="74" fill="#F3EEE4"/>
  <rect x="152" y="246" width="96" height="74" fill="none"
        stroke="#1A1916" stroke-width="1.8"/>
  <line x1="166" y1="280" x2="234" y2="280" stroke="#C4B88A" stroke-width="2.5"/>
  <line x1="166" y1="294" x2="214" y2="294" stroke="#D6CEBD" stroke-width="2"/>
  <g transform="translate(78 404) scale(-0.62 0.62)">
    <path d="M0 10 C -3 -16 2 -46 0 -78" stroke="#C4B88A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0 -4) rotate(-40)">
      <path d="M0 0 C 9.4 -9.7 26.6 -9.2 36.0 0 C 26.6 9.2 9.4 9.7 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="33.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -26) rotate(-140)">
      <path d="M0 0 C 8.1 -8.4 22.9 -8.0 31.0 0 C 22.9 8.0 8.1 8.4 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="28.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -46) rotate(-40)">
      <path d="M0 0 C 6.8 -7.0 19.2 -6.7 26.0 0 C 19.2 6.7 6.8 7.0 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="23.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
    <g transform="translate(0 -62) rotate(-140)">
      <path d="M0 0 C 5.2 -5.4 14.8 -5.1 20.0 0 C 14.8 5.1 5.2 5.4 0 0 Z" fill="#C4B88A" opacity="0.9"/>
      <line x1="2" y1="0" x2="17.0" y2="0" stroke="#E9E2D3" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
  <!-- category rule and swatch, bottom left -->
  <line x1="40" y1="444" x2="150" y2="444" stroke="#1A1916"
        stroke-width="1.5"/>
  <circle cx="352" cy="444" r="9" fill="#C4B88A"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:multiply"/>
</svg>
